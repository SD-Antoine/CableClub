# Builds the site of Cable Club (folder site/, see site/build.mjs) into the branch "site" of this repository.
# The hosting (o2switch, cPanel "Git Version Control") clones that branch and its .cpanel.yml copies it into the
# web root of cableclub.app: see site/README.md.
#
# Runs when the site or the patch notes change on main, after each release (new download links) and on demand.
# Variable (optional): SITE_SIGNED = 1 once SignPath signs CableClub.exe (the page of the downloads then shows the
# code signing policy).
name: Site

on:
  push:
    branches: [main]
    paths: ['site/**', 'CHANGELOG.md', '.github/workflows/site.yml']
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  site:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SITE_SIGNED: ${{ vars.SITE_SIGNED }}
        run: node site/build.mjs

      # the built site becomes a new commit of the branch "site" (only when something changed)
      - name: Branch site
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd site/dist
          git init -q -b site
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin site; then git reset -q --soft FETCH_HEAD; fi
          git add -A
          if git rev-parse -q --verify HEAD >/dev/null && git diff --cached --quiet; then echo 'Site inchange'; exit 0; fi
          git commit -q -m "Site de Cable Club (${GITHUB_SHA::7})"
          git push -q origin site
          echo "Branche site mise a jour"
